    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="small-glow"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .label { fill: #f8fafc; font-size: 15px; font-weight: 700; }
      .muted { fill: #94a3b8; font-size: 12px; }
      .eyebrow { fill: #facc15; font-size: 12px; font-weight: 800; letter-spacing: 2px; }
    </style>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#space)"/>
