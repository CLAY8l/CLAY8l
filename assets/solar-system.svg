<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">CLAY8l's developer solar system</title>
  <desc id="desc">A dark starfield with a glowing sun, three orbiting technology planets, and project paths.</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="45%" r="80%">
      <stop offset="0" stop-color="#11182c"/>
      <stop offset="1" stop-color="#050811"/>
